name: extended

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -race -count=1 -timeout 45m ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./engine, name: FuzzAppendAssemble }
          - { pkg: ./engine, name: FuzzSearchQuery }
          - { pkg: ./msg, name: FuzzMessage }
          - { pkg: ./internal/textproc, name: FuzzDigest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 5m

  reproduce-published-results:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: main64k, args: "-window 64000 -turns 300 -seeds 1 -strategies main" }
          - { name: matched64k, args: "-window 64000 -turns 300 -seeds 1 -strategies matched" }
          - { name: ablation64k, args: "-window 64000 -turns 300 -seeds 1 -strategies ablation" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run ./cmd/stratavell-bench ${{ matrix.suite.args }} -out "$RUNNER_TEMP/${{ matrix.suite.name }}"
      - run: python3 scripts/compare-runs.py bench/results/2026-11-26/${{ matrix.suite.name }}/runs.jsonl "$RUNNER_TEMP/${{ matrix.suite.name }}/runs.jsonl"
