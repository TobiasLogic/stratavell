openapi: 3.1.0
info:
  title: palimpsest context engine API
  version: "1"
  description: |
    Local HTTP API for the palimpsest context engine. The server listens on 127.0.0.1:7077 by default and
    optionally on a Unix domain socket created with mode 0600. Every request except /v1/health needs
    `Authorization: Bearer <token>` when the server was started with a token. Non-loopback TCP listeners
    refuse to start without one.

    Sessions and agents are created only by POST /v1/sessions and POST /v1/sessions/{sid}/agents. Every other
    endpoint returns 404 for an unknown session or agent.

    A host that intercepts its inference loop calls, per turn: append events, assemble, send the returned
    request to its model, report usage, append the assistant message and tool results. Memory tools that the
    model calls are executed with POST .../tools/{name}.
servers:
  - url: http://127.0.0.1:7077
security:
  - bearer: []
paths:
  /v1/health:
    get:
      security: []
      summary: Liveness probe
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
  /v1/version:
    get:
      summary: API, build and configuration schema versions
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Version"}}}}
  /v1/stats:
    get:
      summary: Engine-wide metrics, database size and resource use
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object}}}}
  /v1/tools:
    get:
      summary: Definitions of the memory tools, ready to pass to a model
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ToolDef"}}}}}
  /v1/sessions:
    post:
      summary: Create or open a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                project: {type: string}
                policy: {type: object, description: "Policy JSON (see docs/configuration.md); config_version 0 and 1 are migrated"}
      responses:
        "200": {description: session, content: {application/json: {schema: {type: object, properties: {id: {type: string}, policy: {type: object}}}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/sessions/{sid}:
    parameters: [{$ref: "#/components/parameters/sid"}]
    delete:
      summary: Delete a session and everything derived from it (events, blobs no longer referenced, summaries, indexes, task state)
      responses:
        "200": {description: counts of deleted rows, content: {application/json: {schema: {$ref: "#/components/schemas/DeleteReport"}}}}
  /v1/sessions/{sid}/verify:
    parameters: [{$ref: "#/components/parameters/sid"}]
    get:
      summary: Verify event hashes, sequence continuity, summary lineage and SQLite integrity
      responses:
        "200": {description: report, content: {application/json: {schema: {$ref: "#/components/schemas/VerifyReport"}}}}
  /v1/sessions/{sid}/agents:
    parameters: [{$ref: "#/components/parameters/sid"}]
    post:
      summary: Create or open an agent; with parent set, spawn a subagent with a handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                parent: {type: string}
                handoff: {$ref: "#/components/schemas/Handoff"}
      responses:
        "200": {description: agent, content: {application/json: {schema: {type: object}}}}
        "403": {$ref: "#/components/responses/Error"}
  /v1/sessions/{sid}/agents/{aid}/events:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Append messages to the agent's immutable journal, in order
      description: |
        Each message is validated and checked against tool-call pairing before it is written. A tool result
        must answer an open call; a new assistant or user message is rejected while calls are open. On the
        first rejected message the response is 400 and lists the events appended before it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: {$ref: "#/components/schemas/Message"}
                messages: {type: array, items: {$ref: "#/components/schemas/Message"}}
      responses:
        "200": {description: appended, content: {application/json: {schema: {type: object, properties: {events: {type: array, items: {$ref: "#/components/schemas/EventRef"}}}}}}}
        "400": {$ref: "#/components/responses/Error"}
  /v1/sessions/{sid}/agents/{aid}/assemble:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Build the next model request from the agent's current view
      description: |
        Publishes finished background summaries, applies masking or emergency reduction if needed, and returns
        either the provider-neutral context or a ready request for Anthropic Messages or OpenAI Chat
        Completions. Never returns a context larger than the effective input capacity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system: {type: string}
                tools: {type: array, items: {$ref: "#/components/schemas/ToolDef"}}
                include_memory_tools: {type: boolean}
                query: {type: string, description: optional retrieval hint for evidence injection}
                format: {type: string, enum: [neutral, anthropic, openai]}
                model: {type: string}
                max_tokens: {type: integer}
                cache_ttl: {type: string, enum: ["", "5m", "1h"]}
                thinking: {type: object}
      responses:
        "200":
          description: assembled
          content:
            application/json:
              schema:
                type: object
                properties:
                  context: {type: object, description: provider-neutral context (format neutral)}
                  request: {type: object, description: provider request body (format anthropic or openai)}
                  tokens: {type: integer}
                  capacity: {type: integer}
                  generation: {type: integer}
                  report: {$ref: "#/components/schemas/Report"}
        "409": {description: tool calls still waiting for results, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: "protected_overflow or context_overflow: the request cannot fit", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/sessions/{sid}/agents/{aid}/usage:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Report provider usage for the last request (calibrates token estimates and the rate gate)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Usage"}}}
      responses:
        "200": {description: ok}
  /v1/sessions/{sid}/agents/{aid}/tools/{name}:
    parameters:
      - {$ref: "#/components/parameters/sid"}
      - {$ref: "#/components/parameters/aid"}
      - {name: name, in: path, required: true, schema: {type: string, enum: [memory_search, memory_expand, memory_get_event, memory_get_artifact, memory_get_task_state, memory_get_summary_lineage, memory_stats, memory_update_task]}}
    post:
      summary: Execute a memory tool call made by the model
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {input: {type: object}}}}}
      responses:
        "200": {description: tool output, content: {application/json: {schema: {type: object, properties: {text: {type: string}, is_error: {type: boolean}}}}}}
  /v1/sessions/{sid}/agents/{aid}/search:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    get:
      summary: Lexical, symbol, path and id search over everything this agent may see
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 25}}
        - {name: kinds, in: query, schema: {type: string}, description: "comma list of event,summary"}
        - {name: tools, in: query, schema: {type: string}}
        - {name: path, in: query, schema: {type: string}}
        - {name: seq_from, in: query, schema: {type: integer}}
        - {name: seq_to, in: query, schema: {type: integer}}
      responses:
        "200": {description: hits, content: {application/json: {schema: {type: object, properties: {hits: {type: array, items: {$ref: "#/components/schemas/SearchHit"}}}}}}}
  /v1/sessions/{sid}/agents/{aid}/events/{eid}:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}, {name: eid, in: path, required: true, schema: {type: string}}]
    get:
      summary: Exact original event (404 when it does not exist or the agent may not see it)
      responses:
        "200": {description: event, content: {application/json: {schema: {type: object, properties: {event: {type: object}, message: {$ref: "#/components/schemas/Message"}}}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/sessions/{sid}/agents/{aid}/artifacts/{ref}:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}, {name: ref, in: path, required: true, schema: {type: string}, description: sha256 of the artifact or an event id}]
    get:
      summary: Byte range of an archived artifact
      parameters:
        - {name: offset, in: query, schema: {type: integer}}
        - {name: length, in: query, schema: {type: integer, maximum: 32768}}
      responses:
        "200": {description: bytes, content: {application/json: {schema: {type: object, properties: {offset: {type: integer}, length: {type: integer}, total: {type: integer}, data_base64: {type: string}}}}}}
        "404": {$ref: "#/components/responses/Error"}
  /v1/sessions/{sid}/agents/{aid}/task-state:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    get:
      summary: Live task state items with provenance
      responses:
        "200": {description: items, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/TaskItem"}}}}}}}
    post:
      summary: Record a plan step, decision, rejected approach, finding or note (model provenance)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TaskUpdate"}}}
      responses:
        "200": {description: stored item, content: {application/json: {schema: {$ref: "#/components/schemas/TaskItem"}}}}
        "409": {description: expected_version did not match}
  /v1/sessions/{sid}/agents/{aid}/constraints:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Add an explicit user constraint; it is pinned verbatim for every agent in the session
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}}}}}
      responses:
        "200": {description: stored item, content: {application/json: {schema: {$ref: "#/components/schemas/TaskItem"}}}}
  /v1/sessions/{sid}/agents/{aid}/lineage/{id}:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}, {name: id, in: path, required: true, schema: {type: string}}]
    get:
      summary: Summary lineage tree, or the summaries that cover an event
      responses:
        "200": {description: lineage}
  /v1/sessions/{sid}/agents/{aid}/expand:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Expand a summary into its children or show an event, within a token budget
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}, seq_from: {type: integer}, seq_to: {type: integer}, token_budget: {type: integer}}}}}
      responses:
        "200": {description: text, content: {application/json: {schema: {type: object, properties: {text: {type: string}}}}}}
  /v1/sessions/{sid}/agents/{aid}/stats:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    get:
      summary: Agent view statistics (generation, boundary, frontier, archived tokens, compression ratio)
      responses:
        "200": {description: stats}
  /v1/sessions/{sid}/agents/{aid}/sync:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Publish finished background summaries now (normally done by assemble)
      responses:
        "200": {description: published count}
  /v1/sessions/{sid}/agents/{aid}/complete:
    parameters: [{$ref: "#/components/parameters/sid"}, {$ref: "#/components/parameters/aid"}]
    post:
      summary: Mark a subagent finished; records shared findings and returns a handoff text for the parent
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Completion"}}}
      responses:
        "200": {description: handoff, content: {application/json: {schema: {type: object, properties: {handoff: {type: string}}}}}}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    sid: {name: sid, in: path, required: true, schema: {type: string}}
    aid: {name: aid, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
        code: {type: string, enum: [bad_request, unauthorized, not_found, access_denied, protocol_violation, pending_tool_calls, version_conflict, protected_overflow, context_overflow, render_failed, bad_policy, internal]}
    Version:
      type: object
      properties: {api: {type: string}, version: {type: string}, config_version: {type: integer}}
    Part:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [text, tool_call, tool_result, thinking, redacted_thinking, opaque]}
        text: {type: string}
        tool_call_id: {type: string}
        tool_name: {type: string}
        input: {description: tool call arguments (JSON object), type: object}
        is_error: {type: boolean}
        signature: {type: string, description: provider signature of a thinking block; stored and replayed verbatim}
        data: {type: string, description: redacted thinking or opaque provider block}
        provider: {type: string}
    Meta:
      type: object
      properties:
        content_type: {type: string, enum: [text, file_read, file_write, command, test, search, retrieval, handoff, json]}
        paths: {type: array, items: {type: string}}
        command: {type: string}
        exit_code: {type: integer}
        protected: {type: boolean}
        constraint: {type: boolean, description: user message that is an explicit standing constraint}
        file_hash: {type: string}
        shared: {type: boolean}
        cause_id: {type: string}
    Message:
      type: object
      required: [role, parts]
      properties:
        role: {type: string, enum: [user, assistant, tool]}
        parts: {type: array, items: {$ref: "#/components/schemas/Part"}}
        meta: {$ref: "#/components/schemas/Meta"}
    ToolDef:
      type: object
      properties: {name: {type: string}, description: {type: string}, input_schema: {type: object}}
    EventRef:
      type: object
      properties: {id: {type: string}, seq: {type: integer}, tokens: {type: integer}}
    Usage:
      type: object
      properties:
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        cache_read_input_tokens: {type: integer}
        cache_creation_input_tokens: {type: integer}
    Report:
      type: object
      properties:
        fixed_tokens: {type: integer}
        summary_tokens: {type: integer}
        pinned_tokens: {type: integer}
        task_tokens: {type: integer}
        evidence_tokens: {type: integer}
        history_tokens: {type: integer}
        masked: {type: integer}
        previewed: {type: integer}
        deduped: {type: integer}
        unchanged: {type: integer}
        input_masked: {type: integer}
        usage: {type: number}
        state: {type: string, enum: [normal, soft, aggressive, emergency]}
        actions: {type: array, items: {type: string}}
        published: {type: integer}
        foreground_ms: {type: number}
        wait_ms: {type: number}
        thinking_dropped: {type: integer}
    SearchHit:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [event, summary]}
        agent: {type: string}
        seq: {type: integer}
        tool: {type: string}
        snippet: {type: string}
        score: {type: number}
        provenance: {type: string}
        in_context: {type: boolean}
        stale: {type: boolean}
    TaskItem:
      type: object
      properties:
        id: {type: string}
        kind: {type: string}
        key: {type: string}
        text: {type: string}
        status: {type: string}
        provenance: {type: string, enum: [user, tool, model, inferred, system]}
        scope: {type: string, enum: [private, shared]}
        owner: {type: string}
        source_event: {type: string}
        refs: {type: array, items: {type: string}}
        version: {type: integer}
        supersedes: {type: string}
    TaskUpdate:
      type: object
      required: [kind, text]
      properties:
        kind: {type: string, enum: [plan, decision, rejected, finding, note, symbol, goal]}
        key: {type: string}
        text: {type: string}
        status: {type: string}
        refs: {type: array, items: {type: string}}
        shared: {type: boolean}
        expected_version: {type: integer}
    Handoff:
      type: object
      properties:
        task: {type: string}
        constraints: {type: array, items: {type: string}}
        refs: {type: array, items: {type: string}, description: event or summary ids the parent grants to the child}
        role: {type: string}
    Completion:
      type: object
      properties:
        summary: {type: string}
        findings: {type: array, items: {type: string}}
        refs: {type: array, items: {type: string}}
        failed: {type: boolean}
    DeleteReport:
      type: object
      properties: {events: {type: integer}, summaries: {type: integer}, blobs: {type: integer}, task_items: {type: integer}}
    VerifyReport:
      type: object
      properties:
        events: {type: integer}
        events_ok: {type: integer}
        summaries: {type: integer}
        views_checked: {type: integer}
        problems: {type: array, items: {type: string}}
        sqlite_integrity: {type: string}
