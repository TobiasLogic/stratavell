name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: versions agree across Go, Python, npm and server.json
        run: ./scripts/check-versions.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: unit, integration, crash and deterministic benchmark smoke tests
        run: go test -count=1 ./...
      - name: race detector
        run: go test -race -short -count=1 ./...
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short -count=1 ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -short -count=1 ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -short -count=1 ./...

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/examples-smoke.sh

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/packages-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: stratavell:ci
      - name: MCP handshake inside the container
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run -i --rm stratavell:ci | grep -q '"name":"stratavell"'
      - name: server.json matches the image label
        run: |
          label=$(docker inspect stratavell:ci --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}')
          name=$(jq -r .name server.json)
          test "$label" = "$name"

  bench-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: short deterministic benchmark through the CLI
        run: go run ./cmd/stratavell-bench -window 32000 -max-output 4000 -turns 80 -seeds 1 -strategies main -out "$RUNNER_TEMP/bench"
